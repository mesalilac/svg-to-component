[project]
name = "svg-to-component"
version = "0.1.0"
description = "Convert svg icons to SolidJS components"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cairosvg>=2.9.0",
    "click>=8.3.1",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
]

[tool.ruff.lint]
unfixable = ["F401"]
